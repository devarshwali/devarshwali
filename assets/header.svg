<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Terminal: dev@product-engineer, whoami">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="0.5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
    <style>
      text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 17px; }
      .dim { fill: #8b949e; }
      .g { fill: #3fb950; }
      .b { fill: #58a6ff; }
      .p { fill: #bc8cff; }
      .w { fill: #e6edf3; }
      .o { fill: #f0883e; }
      .line { opacity: 0; }
      .l1 { animation: show 0.01s 0.3s forwards; }
      .l2 { animation: show 0.01s 1.1s forwards; }
      .l3 { animation: show 0.01s 1.6s forwards; }
      .l4 { animation: show 0.01s 2.1s forwards; }
      .l5 { animation: show 0.01s 2.6s forwards; }
      .l6 { animation: show 0.01s 3.1s forwards; }
      .l7 { animation: show 0.01s 3.6s forwards; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes show { to { opacity: 1; } }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect x="4" y="4" width="892" height="292" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="4" y="4" width="892" height="40" rx="14" fill="#21262d"/>
  <rect x="4" y="30" width="892" height="14" fill="#21262d"/>
  <circle cx="30" cy="24" r="7" fill="#ff5f56"/>
  <circle cx="54" cy="24" r="7" fill="#ffbd2e"/>
  <circle cx="78" cy="24" r="7" fill="#27c93f"/>
  <text x="450" y="30" text-anchor="middle" class="dim" style="font-size:13px">dev@product-engineer: ~/shipping</text>
  <rect x="4" y="292" width="892" height="3" fill="url(#glow)"/>

  <g class="line l1"><text x="28" y="78"><tspan class="g">dev@shipyard</tspan><tspan class="dim">:</tspan><tspan class="b">~</tspan><tspan class="dim">$ </tspan><tspan class="w">whoami</tspan></text></g>
  <g class="line l2"><text x="28" y="108" class="p">Devarsh Wali, AI Engineer / Full Stack Product Builder</text></g>
  <g class="line l3"><text x="28" y="138"><tspan class="g">dev@shipyard</tspan><tspan class="dim">:</tspan><tspan class="b">~</tspan><tspan class="dim">$ </tspan><tspan class="w">cat stack.txt</tspan></text></g>
  <g class="line l4"><text x="28" y="168"><tspan class="g">LLMs</tspan><tspan class="dim"> x </tspan><tspan class="b">full-stack</tspan><tspan class="dim"> x </tspan><tspan class="o">product</tspan><tspan class="dim"> x </tspan><tspan class="p">behavioral psych</tspan></text></g>
  <g class="line l5"><text x="28" y="198"><tspan class="g">dev@shipyard</tspan><tspan class="dim">:</tspan><tspan class="b">~</tspan><tspan class="dim">$ </tspan><tspan class="w">git log --oneline -3</tspan></text></g>
  <g class="line l6">
    <text x="28" y="228"><tspan class="o">a1f3c9e</tspan><tspan class="w"> idea to working prototype in days, not quarters</tspan></text>
    <text x="28" y="252"><tspan class="o">7b20d4a</tspan><tspan class="w"> cut chatbot hallucination from 12% to 2%</tspan></text>
  </g>
  <g class="line l7">
    <text x="28" y="276"><tspan class="g">dev@shipyard</tspan><tspan class="dim">:</tspan><tspan class="b">~</tspan><tspan class="dim">$ </tspan><tspan class="w cursor">_</tspan></text>
  </g>
</svg>
